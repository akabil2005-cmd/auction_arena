# Render.com — Auction Arena backend (Web Service + Socket.IO)
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: auction-arena-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: FRONTEND_URL
        sync: false
      - key: MONGODB_URI
        sync: false
        optional: true
